apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: regresion-redirect-to-https
  namespace: default
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: regresion-http-redirect
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: default-regresion-redirect-to-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: regresion.incodemode.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: regresion
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: regresion-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: regresion.incodemode.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: regresion
                port:
                  number: 80
  tls:
    - hosts:
        - regresion.incodemode.com
